<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split the Bill</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Split the Bill</h1>

    <section>
      <h2>Items</h2>
      <form id="item-form">
        <input id="item-name" placeholder="Item" required>
        <input id="item-price" type="number" min="0" step="0.01" placeholder="Price" required>
        <button type="submit">Add item</button>
      </form>
      <ul id="items"></ul>
    </section>

    <section class="grid">
      <label>Tax %
        <input id="tax" type="number" min="0" step="0.1" value="8">
      </label>
      <label>Tip %
        <input id="tip" type="number" min="0" step="1" value="15">
      </label>
      <label>People
        <input id="people" type="number" min="1" step="1" value="2">
      </label>
    </section>

    <section>
      <h2>Discount code</h2>
      <form id="discount-form">
        <input id="discount-code" placeholder="e.g. SAVE10">
        <button type="submit">Apply</button>
      </form>
      <p id="discount-message"></p>
    </section>

    <section id="summary">
      <div><span>Subtotal</span><span id="subtotal">$0.00</span></div>
      <div><span>Discount</span><span id="discount-amount">-$0.00</span></div>
      <div><span>Tax</span><span id="tax-amount">$0.00</span></div>
      <div><span>Tip</span><span id="tip-amount">$0.00</span></div>
      <div class="total"><span>Total</span><span id="total">$0.00</span></div>
      <div class="total"><span>Each person pays</span><span id="per-person">$0.00</span></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
